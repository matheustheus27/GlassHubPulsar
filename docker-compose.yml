services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: document-webpage-client
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "
      for f in PersonalData SummaryData SkillsData ExperienceData EducationData SettingsData TranslationsData LanguagesData CoverLetterData ProjectData; do
        if [ ! -f src/app/data/$$f.ts ] && [ -f src/app/data/$$f.ts.example ]; then
          cp src/app/data/$$f.ts.example src/app/data/$$f.ts;
        fi;
      done && npm run dev -- --host
      "
    depends_on:
      - backend
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "react", "service": "frontend"}]'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: document-export-server
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm run dev"
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "backend"}]'

  ollama:
    image: ollama/ollama:latest
    container_name: document-ai-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - doc_network
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait"]
    labels:
      com.datadoghq.ad.logs: '[{"source": "ollama", "service": "ai-engine"}]'

  datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY:-sua_api_key_aqui}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - doc_network

networks:
  doc_network:
    driver: bridge

volumes:
  ollama_data: