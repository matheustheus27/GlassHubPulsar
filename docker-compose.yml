name: glasshub_pulsar

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: glasshub-gateway
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - frontend
      - backend
    networks:
      - doc_network
    restart: unless-stopped
    labels:
      com.datadoghq.ad.logs: '[{"source": "nginx", "service": "gateway"}]'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: glasshub-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost/api
      - VITE_BACKEND_URL=http://backend:3001
      - DOCKER_CONTAINER=true
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "react", "service": "frontend"}]'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-backend-api
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - RABBITMQ_URL=amqp://glasshub:glasshub_mq_2026@rabbitmq:5672
      - JWT_SECRET=glasshub_super_secret_jwt_key_2026
      - DD_ENABLED=true
      - DD_AGENT_HOST=datadog
      - NOTIFICATION_EMAIL_ENABLED=false
      - NOTIFICATION_WHATSAPP_ENABLED=false
    command: sh -c "npx prisma generate && node prisma/init-db.js && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "backend-api"}]'

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: glasshub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=glasshub
      - RABBITMQ_DEFAULT_PASS=glasshub_mq_2026
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "rabbitmq", "service": "message-broker"}]'

  postgres:
    image: postgres:16-alpine
    container_name: glasshub-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=glasshub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doc_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: glasshub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker-translation:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-translation
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - OLLAMA_HOST=http://ollama:11434
      - RABBITMQ_URL=amqp://glasshub:glasshub_mq_2026@rabbitmq:5672
    command: sh -c "node -e 'require(\"./workers/translationWorker\"); console.log(\"Translation worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-translation"}]'

  worker-notification:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-notification
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - RABBITMQ_URL=amqp://glasshub:glasshub_mq_2026@rabbitmq:5672
    command: sh -c "node -e 'require(\"./workers/notificationWorker\"); console.log(\"Notification worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-notification"}]'

  worker-pdf:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-pdf
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - RABBITMQ_URL=amqp://glasshub:glasshub_mq_2026@rabbitmq:5672
    command: sh -c "node -e 'require(\"./workers/pdfWorker\"); console.log(\"PDF worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-pdf"}]'

  worker-analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-analytics
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - OLLAMA_HOST=http://ollama:11434
    command: sh -c "node -e 'require(\"./workers/analyticsWorker\"); console.log(\"Analytics/ATS worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-analytics"}]'

  worker-ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-ocr
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - OLLAMA_HOST=http://ollama:11434
    command: sh -c "node -e 'require(\"./workers/ocrWorker\"); console.log(\"OCR Vision Worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-ocr"}]'

  worker-cdc:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: glasshub-worker-cdc
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glasshub_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
    command: sh -c "node -e 'require(\"./workers/cdcWorker\"); console.log(\"CDC Cache Sync Worker running\"); setInterval(()=>{}, 1000);'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - doc_network
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "worker-cdc"}]'

  ollama:
    image: ollama/ollama:latest
    container_name: document-ai-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - doc_network
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && (ollama pull llama3.2 || true) && (ollama pull llama3.2-vision || true) && (ollama pull qwen2.5:7b || true) && (ollama pull nomic-embed-text || true) && wait" ]
    labels:
      com.datadoghq.ad.logs: '[{"source": "ollama", "service": "ai-engine"}]'

  datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: glasshub-datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY:-glasshub_local_dev_key}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_BIND_HOST=0.0.0.0
    ports:
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - doc_network

networks:
  doc_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
