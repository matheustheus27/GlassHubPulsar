<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favCosmic" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="favBeam" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#030712" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#favCosmic)" fill-opacity="0.18" />

  <!-- Concentric Signal Waves -->
  <circle cx="32" cy="32" r="22" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="32" cy="32" r="17" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
  <circle cx="32" cy="32" r="12" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8" />

  <!-- Vertical Beam -->
  <path d="M30 4H34V60H30Z" fill="url(#favBeam)" opacity="0.85" />

  <!-- Geometric Pulsar Star (8-Point) -->
  <polygon
    points="32,12 36,25 49,20 40,29 52,32 40,35 49,44 36,39 32,52 28,39 15,44 24,35 12,32 24,29 15,20 28,25"
    fill="url(#favCosmic)"
    fill-opacity="0.6"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- High-Luminance Center -->
  <circle cx="32" cy="32" r="5.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="3" fill="#38bdf8" />
</svg>
