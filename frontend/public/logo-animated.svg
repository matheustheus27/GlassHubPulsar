<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Cosmic Gradients -->
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sheenAnimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="pulsarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="20" y="20" width="200" height="200" rx="48" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.65; transform: scaleX(0.9); }
      50% { opacity: 1; transform: scaleX(1.15); }
    }
    @keyframes pulseWave {
      0%, 100% { opacity: 0.35; transform: scale(0.97); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    @keyframes slowRotateStar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sheenPass {
      0% { transform: translateX(-220px) rotate(25deg); }
      100% { transform: translateX(340px) rotate(25deg); }
    }
    .pulsar-beam-anim {
      transform-origin: 120px 120px;
      animation: pulseBeam 2.5s ease-in-out infinite;
    }
    .pulsar-wave-1 {
      transform-origin: 120px 120px;
      animation: pulseWave 3s ease-in-out infinite;
    }
    .pulsar-wave-2 {
      transform-origin: 120px 120px;
      animation: pulseWave 3s ease-in-out infinite 0.75s;
    }
    .pulsar-wave-3 {
      transform-origin: 120px 120px;
      animation: pulseWave 3s ease-in-out infinite 1.5s;
    }
    .pulsar-star-float {
      transform-origin: 120px 120px;
    }
    .pulsar-sheen {
      animation: sheenPass 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Deep Space Ambient Aura -->
  <circle cx="120" cy="120" r="90" fill="url(#cosmicGrad)" opacity="0.25" filter="url(#pulsarGlow)" />

  <!-- Glassmorphic Rounded Outer Squircle -->
  <rect
    x="20"
    y="20"
    width="200"
    height="200"
    rx="48"
    fill="url(#glassCardGrad)"
    stroke="rgba(255, 255, 255, 0.25)"
    stroke-width="2"
  />

  <!-- Specular Inset Border -->
  <rect
    x="26"
    y="26"
    width="188"
    height="188"
    rx="42"
    fill="none"
    stroke="url(#cosmicGrad)"
    stroke-opacity="0.35"
    stroke-width="1.5"
  />

  <!-- Concentric Signal Waves (Rhythmic Transmission Waves) -->
  <circle class="pulsar-wave-1" cx="120" cy="120" r="76" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <circle class="pulsar-wave-2" cx="120" cy="120" r="58" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <circle class="pulsar-wave-3" cx="120" cy="120" r="42" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.75" fill="none" />

  <!-- Vertical Pulsar Light Beam -->
  <path
    class="pulsar-beam-anim"
    d="M114 24H126V216H114Z"
    fill="url(#beamGrad)"
    filter="url(#pulsarGlow)"
  />

  <!-- Star Layer Group -->
  <g class="pulsar-star-float">
    <!-- Secondary 8-Point Star (Back facet) -->
    <polygon
      points="120,68 132,98 162,88 142,110 172,120 142,130 162,152 132,142 120,172 108,142 78,152 98,130 68,120 98,110 78,88 108,98"
      fill="#8b5cf6"
      fill-opacity="0.35"
      stroke="url(#cosmicGrad)"
      stroke-width="1.5"
    />

    <!-- Primary 8-Point Geometric Crystal Star -->
    <polygon
      points="120,52 134,95 178,78 148,110 188,120 148,130 178,162 134,145 120,188 106,145 62,162 92,130 52,120 92,110 62,78 106,95"
      fill="url(#cosmicGrad)"
      fill-opacity="0.45"
      stroke="rgba(255, 255, 255, 0.85)"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Internal Diamond Specular Facets -->
    <polygon points="120,56 134,106 120,120 106,106" fill="#ffffff" fill-opacity="0.65" />
    <polygon points="120,120 134,134 120,184 106,134" fill="#3b82f6" fill-opacity="0.45" />
    <polygon points="56,120 106,106 120,120 106,134" fill="#06b6d4" fill-opacity="0.55" />
    <polygon points="120,120 134,106 184,120 134,134" fill="#a855f7" fill-opacity="0.55" />

    <!-- Luminous Pulsar Core -->
    <circle cx="120" cy="120" r="14" fill="#ffffff" filter="url(#pulsarGlow)" />
    <circle cx="120" cy="120" r="8" fill="#e0f2fe" />
    <circle cx="120" cy="120" r="4" fill="#ffffff" />
  </g>

  <!-- Animated Sheen Overlay -->
  <g clip-path="url(#squircleClip)">
    <rect class="pulsar-sheen" x="0" y="0" width="60" height="240" fill="url(#sheenAnimGrad)" />
  </g>
</svg>
