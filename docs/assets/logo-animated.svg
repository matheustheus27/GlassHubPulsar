<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glassFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glassFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatDoc {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes sheenMove {
      0% { transform: translateX(-150px) rotate(25deg); }
      100% { transform: translateX(250px) rotate(25deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    .g-glow-ring {
      transform-origin: 100px 100px;
      animation: pulseGlow 3.5s ease-in-out infinite;
    }
    .g-doc {
      animation: floatDoc 3s ease-in-out infinite;
    }
    .g-sheen {
      animation: sheenMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Outer Neon Glow Ring -->
  <circle class="g-glow-ring" cx="100" cy="100" r="82" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Outer Hexagon Prism Frame -->
  <polygon points="100,16 172,56 172,136 100,176 28,136 28,56" fill="#030712" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Glass Prism Top Facet -->
  <polygon points="100,16 172,56 100,96 28,56" fill="url(#glassFacet1)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Glass Prism Left Facet -->
  <polygon points="28,56 100,96 100,176 28,136" fill="url(#glassFacet2)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" />

  <!-- Glass Prism Right Facet -->
  <polygon points="172,56 172,136 100,176 100,96" fill="url(#glassFacet1)" stroke="rgba(139,92,246,0.4)" stroke-width="1.5" />

  <!-- Document Shield Core (Resume Symbol) -->
  <g class="g-doc">
    <!-- Document Card -->
    <rect x="68" y="62" width="64" height="76" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="url(#primaryGrad)" stroke-width="2.5" />
    
    <!-- Resume Headers and Bullets -->
    <line x1="80" y1="78" x2="120" y2="78" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="80" y1="90" x2="112" y2="90" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="80" y1="100" x2="120" y2="100" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="80" y1="110" x2="102" y2="110" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Luminous Sparkle Badge -->
    <circle cx="120" cy="122" r="7" fill="#06b6d4" filter="url(#neonGlow)" />
    <circle cx="120" cy="122" r="3.5" fill="#ffffff" />
  </g>

  <!-- Animated Sheen Filter Overlay -->
  <g clip-path="url(#hexClip)">
    <rect class="g-sheen" x="0" y="0" width="45" height="200" fill="url(#sheenGrad)" />
  </g>

  <clipPath id="hexClip">
    <polygon points="100,16 172,56 172,136 100,176 28,136 28,56" />
  </clipPath>
</svg>
